include:
  - project: 'other/gitlab-ci'
    file:
      - '/templates/.nodejs.yml'
      - '/templates/.buildah.yml'
      - '/templates/.k8s.yml'

variables:
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/yuanfu-tms/node-tms"
  CI_TAG: "$CI_COMMIT_SHORT_SHA"
  K8S_NAME_SPACE: "tms"
  K8S_DEPLOY_NAME: "node-tms"

stages:
  - build
  - images-build
  - deploy

# 构建阶段
build:
  stage: build
  extends: .base-nodejs
  only:
    - develop

# 容器镜像构建阶段
images-build:
  stage: images-build
  extends: .base-buildah
  only:
    - develop

# 部署阶段
deploy:
  stage: deploy
  extends: .base-deploy
  only:
    - develop
  dependencies:
    - images-build
