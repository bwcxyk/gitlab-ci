spec:
  inputs:
    MAVEN_ARGS:
      default: ""
      description: "Additional Maven arguments"
    REGISTRY:
      default: "local"
      description: "镜像仓库"
      options:
        - "local"
        - "aliyun"
        - "huaweicloud"
---

include:
  - project: 'other/gitlab-ci'
    file:
      - '/templates/.maven.yml'
      - '/templates/.buildah.yml'
      - '/templates/.k8s.yml'

variables:
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/yuanfu-tms/tms"
  CI_TAG: "$CI_COMMIT_SHORT_SHA"
  K8S_NAME_SPACE: "tms"
  K8S_DEPLOY_NAME: "tms"

stages:
  - build
  - images-build
  - deploy

# 构建阶段
build:
  stage: build
  extends: .base-maven

# 容器镜像构建阶段
images-build:
  stage: images-build
  extends: .base-buildah
  only:
    - develop

# 部署阶段
deploy:
  stage: deploy
  extends: .base-deploy
  only:
    - develop
  dependencies:
    - images-build
