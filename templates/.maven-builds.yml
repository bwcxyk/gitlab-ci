# Maven 编译
.maven-compile:
  image: maven:3.9.9-eclipse-temurin-8-alpine
  script:
    - mvn compile
  artifacts:
    expire_in: 1 day
    paths:
      - '**/target/classes/'

# Maven SonarQube 代码质量扫描
.maven-sonar:
  image: public.ecr.aws/docker/library/maven:3.9.9-eclipse-temurin-21-alpine
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      mvn sonar:sonar
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=600
  allow_failure: false

# Maven 构建
.maven-package:
  image: maven:3.9.9-eclipse-temurin-8-alpine
  script:
    - mvn package -Dmaven.test.skip=true
  artifacts:
    expire_in: 1 day
    paths:
      - '**/target/*.jar'
      - '**/target/*.war'

# Maven 部署
.maven-deploy:
  image: maven:3.9.9-eclipse-temurin-8-alpine
  script:
    - mvn deploy -Dmaven.test.skip=true
  artifacts:
    expire_in: 1 day
    paths:
      - '**/target/*.jar'
